name: ReTryPay CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-tests:
    name: Code Quality, Type Safety & Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Check Formatting with Ruff
        run: |
          ruff format --check .

      - name: Static Type Analysis with MyPy
        run: |
          mypy retrypay tests

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=retrypay --cov-report=json:coverage.json tests/

      - name: Enforce Multi-Tier Coverage Gates
        run: |
          python scripts/check_coverage.py coverage.json

  frontend-quality-and-build:
    name: Frontend Lint, Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm ci

      - name: Frontend Linting (ESLint)
        working-directory: web
        run: npm run lint

      - name: Frontend Tests (Vitest)
        working-directory: web
        run: npm run test

      - name: Frontend Production Build (Vite & TSC)
        working-directory: web
        run: npm run build
